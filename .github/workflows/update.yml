name: Weekly JRA update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Update JRA data
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          JST = dt.timezone(dt.timedelta(hours=9))
          now = dt.datetime.now(JST)
          today = now.date()

          url = (
              f"https://www.jra.go.jp/keiba/calendar2026/"
              f"{today:%Y}/{today:%m}/{today:%m%d}.html"
          )

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 "
                  "like Mac OS X) AppleWebKit/605.1.15"
              ),
              "Accept-Language": "ja-JP,ja;q=0.9"
          }

          r = requests.get(
              url,
              headers=headers,
              timeout=30
          )

          r.raise_for_status()

          soup = BeautifulSoup(
              r.content,
              "html.parser"
          )

          lines = []

          for item in soup.stripped_strings:
              text = re.sub(
                  r"\s+",
                  " ",
                  item
              ).strip()

              if text:
                  lines.append(text)

          venues = (
              "東京",
              "京都",
              "中山",
              "阪神",
              "新潟",
              "中京",
              "福島",
              "小倉",
              "札幌",
              "函館"
          )

          races = []
          current_venue = ""

          for i, line in enumerate(lines):

              venue_match = re.search(
                  r"\d+回("
                  + "|".join(venues)
                  + r")\d+日",
                  line
              )

              if venue_match:
                  current_venue = venue_match.group(1)

              race_match = re.match(
                  r"^(\d{1,2})レース$",
                  line
              )

              if not race_match:
                  continue

              if not current_venue:
                  continue

              race_no = int(
                  race_match.group(1)
              )

              race_name = ""
              start_time = ""

              for candidate in lines[
                  i + 1:i + 10
              ]:

                  time_match = re.search(
                      r"(\d{1,2})時(\d{2})分",
                      candidate
                  )

                  if time_match:
                      start_time = (
                          time_match.group(1)
                          + ":"
                          + time_match.group(2)
                      )
                      break

                  if not race_name:
                      race_name = candidate

              if race_name and start_time:

                  races.append({
                      "venue": current_venue,
                      "race": race_no,
                      "name": race_name,
                      "start": start_time
                  })

          unique = {}

          for race in races:

              key = (
                  race["venue"],
                  race["race"]
              )

              unique[key] = race

          races = list(
              unique.values()
          )

          races.sort(
              key=lambda x: (
                  x["venue"],
                  x["race"]
              )
          )

          print(
              "JRA races found:",
              len(races)
          )

          for race in races:
              print(
                  race["venue"],
                  race["race"],
                  race["name"],
                  race["start"]
              )

          if not races:
              raise RuntimeError(
                  "JRA race data could not be parsed."
              )

          data = {
              "updated_at": now.isoformat(
                  timespec="minutes"
              ),
              "date": today.isoformat(),
              "source": "JRA公式",
              "source_url": url,
              "race_count": len(races),
              "races": races
          }

          Path("data.json").write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          rows = ""

          for race in races:

              rows += f"""
              <div class="race">
                <div class="venue">
                  {race["venue"]}
                </div>

                <b>
                  {race["race"]}R　{race["name"]}
                </b>

                <br>

                <small>
                  発走 {race["start"]}
                </small>
              </div>
              """

          html = f"""<!doctype html>
          <html lang="ja">

          <head>

          <meta charset="utf-8">

          <meta
            name="viewport"
            content="width=device-width,initial-scale=1"
          >

          <meta
            name="theme-color"
            content="#111827"
          >

          <title>複勝転がしAI</title>

          <style>

          body {{
            margin: 0;
            background: #f3f5f7;
            color: #17202a;
            font-family:
              -apple-system,
              BlinkMacSystemFont,
              sans-serif;
          }}

          main {{
            max-width: 720px;
            margin: auto;
            padding: 16px;
          }}

          header {{
            background: #111827;
            color: white;
            padding: 22px;
            border-radius: 20px;
          }}

          .card {{
            background: white;
            padding: 16px;
            border-radius: 16px;
            margin: 12px 0;
          }}

          .race {{
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin: 8px 0;
            background: #fafafa;
          }}

          .venue {{
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
          }}

          small {{
            color: #666;
          }}

          .status {{
            font-size: 18px;
            font-weight: bold;
          }}

          </style>

          </head>

          <body>

          <main>

          <header>
            <h1>複勝転がしAI</h1>

            <div>
              JRA公式情報を使った
              個人用分析ツール
            </div>
          </header>

          <section class="card">

            <b>システム状態</b>

            <p class="status">
              JRA開催情報：自動更新
            </p>

            <small>
              最終更新：
              {data["updated_at"]}
            </small>

            <br>

            <small>
              取得レース数：
              {data["race_count"]}
            </small>

          </section>

          <section class="card">

            <h2>本日の候補</h2>

            <p>
              馬別データ・オッズ分析を追加中です。
            </p>

            <p>
              現段階では「買い」を断定しません。
            </p>

          </section>

          <section class="card">

            <h2>今日のJRA開催</h2>

            {rows}

          </section>

          <section class="card">

            <h2>今後の分析</h2>

            <p>
              出馬表
              →
              複勝オッズ
              →
              過去成績
              →
              3着内評価
              →
              複勝転がし候補
              →
              的中率・回収率
            </p>

          </section>

          <footer>

            <small>
              出典：JRA公式。
              予測は利益を保証しません。
            </small>

          </footer>

          </main>

          </body>
          </html>
          """

          Path("index.html").write_text(
              html,
              encoding="utf-8"
          )

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html data.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix JRA race data parser"
            git push
          fi
